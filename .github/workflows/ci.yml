name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      # Install system dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-latex-recommended texlive-lang-english
          sudo apt-get install -y npm
          sudo npm install -g tree-sitter-cli
          # Install Ott (requires OCaml and OPAM)
          sudo apt-get install -y opam
          opam init -y --disable-sandboxing
          opam install -y ott
          echo "$HOME/.opam/default/bin" >> $GITHUB_PATH


      # Set up Lean with cache (handled by lean-action)
      - uses: leanprover/lean-action@v1
        with:
          build: true   # runs `lake build` automatically
          test: false   # we'll run tests separately

      # Build parser + spec first
      - name: Build Ott + parser
        run: make all

      # Run tests (small + big step)
      - name: Run tests
        run: make test